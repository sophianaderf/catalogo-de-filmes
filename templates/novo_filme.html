<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Novo Filme</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="navbar">
        <h1 class="logo">DEV<span>FLIX</span></h1>
    </header>

    <section class="form-container">
        <h2>Cadastrar Novo Filme</h2>

        <form action="{{ url_for('novo_filme') }}" method="POST" class="form-filme">
            <input type="text" name="titulo" placeholder="Nome do Filme" required>
            <input type="text" name="genero" placeholder="Gênero" required>
            <input type="date" name="ano_lancamento" placeholder="Data de lanãmento" required>
            <input type="number" step="0.1" name="nota" placeholder="Nota (Ex: 8.5)" min="0" max="10" required>
            <input type="text" name="capa" placeholder="URL da Capa (http://...)">

            <button type="submit" class="btn-save">
                Salvar Filme
            </button>
        </form>

        <a href="{{ url_for('listar_filme') }}" class="btn-back">
            Voltar ao catálogo
        </a>
    </section>
</body>
</html>
